<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIS Interactive Modeling</title>
    <!-- Version-pinned, not @latest: a silent upgrade must not change the
         viewer mid-project. Vendoring this locally is part of the same
         deployment decision as the basemap and terrain tiles. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.5 system-ui, "Malgun Gothic", sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .panel {
        position: absolute;
        z-index: 1;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 10px 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      }
      #controls {
        top: 10px;
        left: 10px;
        width: 230px;
      }
      #debug-panel {
        bottom: 10px;
        left: 10px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        white-space: pre;
        color: #333;
      }
      html.comparison-embed #controls,
      html.comparison-embed #debug-panel,
      html.comparison-embed #scenario-panel {
        display: none !important;
      }
      #controls h1 {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 600;
      }
      #controls label {
        display: block;
        margin: 8px 0 2px;
        color: #555;
      }
      #controls input[type="range"] {
        width: 100%;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 6px 0;
      }
      .row label {
        margin: 0;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
        color: #555;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.25);
      }
      #status {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
        color: #777;
      }
      #zone-info:not(:empty) {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
        font-size: 12px;
      }
      #zone-info b {
        display: block;
        margin-bottom: 2px;
      }
      #zone-info span {
        color: #666;
      }

      #scenario-panel {
        top: 64px;
        right: 12px;
        z-index: 2;
        width: clamp(230px, 22vw, 320px);
        max-height: calc(100vh - 168px);
        overflow-y: auto;
        padding: 14px 16px 16px;
        border-color: #d8d2c9;
        border-radius: 2px;
        background: rgba(251, 250, 248, 0.96);
        box-shadow: 0 6px 24px rgba(31, 27, 23, 0.12);
        color: #26221f;
      }
      #scenario-panel[hidden] {
        display: none;
      }
      .scenario-kicker {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #b42323;
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .scenario-kicker::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #dc2626;
        content: "";
      }
      #scenario-title {
        margin: 7px 0 0;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .scenario-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding-bottom: 11px;
        border-bottom: 1px solid #ded9d1;
        color: #6f6861;
        font-size: 11px;
      }
      #scenario-status {
        padding: 2px 6px;
        background: #eee9e3;
        color: #4c4640;
        font-weight: 650;
      }
      .scenario-zone {
        padding: 12px 0 2px;
      }
      .scenario-zone + .scenario-zone {
        margin-top: 8px;
        border-top: 1px solid #ded9d1;
      }
      .scenario-zone-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .scenario-zone h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }
      .scenario-green {
        color: #6f6861;
        font-size: 10px;
      }
      .scenario-building {
        margin-top: 9px;
      }
      .scenario-building-name {
        display: block;
        font-size: 12px;
        font-weight: 650;
      }
      .scenario-building-facts {
        display: block;
        margin-top: 1px;
        color: #645d56;
        font-size: 11px;
      }
      .scenario-building-note {
        display: block;
        margin-top: 4px;
        color: #81786f;
        font-size: 10px;
        line-height: 1.45;
      }
      .scenario-source {
        margin: 13px 0 0;
        padding-top: 9px;
        border-top: 1px solid #ded9d1;
        color: #928980;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* Zone update panel. Right-hand side, so it never covers the
         controls or the debug readout while a zone is being edited. */
      #update-panel {
        top: 10px;
        right: 10px;
        width: 268px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        display: none;
      }
      #update-panel.open {
        display: block;
      }
      #update-panel h1 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
      }
      #update-zone {
        color: #666;
        font-size: 12px;
      }
      #update-plan {
        margin: 6px 0 0;
        padding: 5px 7px;
        background: #f4f0e6;
        border-left: 3px solid #c9a227;
        font-size: 11px;
        color: #6b5b1e;
      }
      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 5px 0;
      }
      .field label {
        flex: 0 0 74px;
        color: #555;
        font-size: 12px;
      }
      .field input,
      .field select {
        flex: 1;
        min-width: 0;
        padding: 2px 4px;
        border: 1px solid #bbb;
        border-radius: 3px;
        font: inherit;
        font-size: 12px;
      }
      .mass {
        margin: 6px 0;
        padding: 6px 7px;
        border: 1px solid #ddd;
        border-radius: 3px;
        background: #fafafa;
      }
      .mass-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #777;
        margin-bottom: 2px;
      }
      .mass-head button {
        border: 0;
        background: none;
        color: #b33;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0 2px;
      }
      #update-panel .buttons {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #update-panel button.action {
        flex: 1;
        padding: 5px;
        border: 1px solid #bbb;
        border-radius: 3px;
        background: #fff;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      #update-panel button.action:hover {
        background: #f0f0f0;
      }
      #update-panel button.primary {
        background: #2c6fb3;
        border-color: #2c6fb3;
        color: #fff;
      }
      #update-panel button.primary:hover {
        background: #245c95;
      }
      #add-mass {
        width: 100%;
        padding: 3px;
        border: 1px dashed #bbb;
        border-radius: 3px;
        background: #fff;
        color: #666;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      #update-report {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        white-space: pre-wrap;
        color: #444;
      }
      #update-report .bad {
        color: #b33;
        font-weight: 600;
      }
      #update-report .good {
        color: #2a7a3a;
      }
      .io-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
      }
      .io-row button {
        flex: 1;
        padding: 4px;
        border: 1px solid #bbb;
        border-radius: 3px;
        background: #fff;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .hint {
        margin-top: 6px;
        color: #999;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="controls" class="panel" hidden aria-hidden="true">
      <h1>건물 구성</h1>

      <div class="row">
        <input id="swap" type="checkbox" checked />
        <label for="swap">지정 구역 NGII 건물로 교체</label>
      </div>

      <div class="row">
        <input id="show-zones" type="checkbox" checked />
        <label for="show-zones">세운지구 구역 표시</label>
      </div>

      <div class="legend">
        <span class="swatch" style="background: #d33a2c"></span> NGII (구역 내)
      </div>
      <div class="legend">
        <span class="swatch" style="background: #9a9a9a"></span> OSM (구역 외)
      </div>

      <div id="zone-info"></div>

      <div id="status">초기화 중...</div>
    </div>

    <aside
      id="scenario-panel"
      class="panel"
      aria-label="적용 시나리오 정보"
      hidden
    >
      <div class="scenario-kicker">적용 시나리오</div>
      <h1 id="scenario-title"></h1>
      <div class="scenario-meta">
        <span id="scenario-applied"></span>
        <span id="scenario-status"></span>
      </div>
      <div id="scenario-zones"></div>
      <p class="scenario-source">Source · data/sim/zone_config.json</p>
    </aside>

    <div id="debug-panel" class="panel">loading</div>

    <script>
      if (location.pathname.includes("/gis/after/")) {
        window.__MIMLAB_GIS_DATA_BASE__ = new URL("../data/api/", location.href).href;
        window.__MIMLAB_GIS_VIEWS_URL__ = new URL("./views.json", location.href).href;
      }
    </script>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script type="module" src="./main.js?v=entity-details-v2"></script>
  </body>
</html>
